version: 0.2
phases:
  pre_build:
    on-failure: ABORT
    commands:
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    on-failure: ABORT
    commands:
      - test -n "$IMAGE_TAG" && test "$IMAGE_TAG" != "latest"
      - docker build --build-arg NODE_IMAGE="${NODE_IMAGE:-public.ecr.aws/docker/library/node:22-alpine3.24}" -f Dockerfile.web -t "$ECR_REGISTRY/theckards-web:$IMAGE_TAG" .
      - docker build --build-arg NODE_IMAGE="${NODE_IMAGE:-public.ecr.aws/docker/library/node:22-alpine3.24}" -f Dockerfile.worker -t "$ECR_REGISTRY/theckards-worker:$IMAGE_TAG" .
  post_build:
    commands:
      - docker push "$ECR_REGISTRY/theckards-web:$IMAGE_TAG"
      - docker push "$ECR_REGISTRY/theckards-worker:$IMAGE_TAG"
