version: 0.2
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  build:
    commands:
      - docker build -f Dockerfile.web -t $ECR_REGISTRY/theckards-web:$IMAGE_TAG .
      - docker build -f Dockerfile.worker -t $ECR_REGISTRY/theckards-worker:$IMAGE_TAG .
  post_build:
    commands:
      - docker push $ECR_REGISTRY/theckards-web:$IMAGE_TAG
      - docker push $ECR_REGISTRY/theckards-worker:$IMAGE_TAG
