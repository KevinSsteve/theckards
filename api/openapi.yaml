openapi: 3.1.0
info:
  title: Theckards API
  version: 0.3.0
  license:
    name: Proprietary
servers:
  - url: https://theckards.linkealls.com
paths:
  /api/auth/login:
    get:
      summary: Start Cognito sign-in
      operationId: startSignIn
      security: []
      responses:
        '302': { description: Redirect to Cognito managed login }
        '429': { $ref: '#/components/responses/Problem' }
  /api/auth/callback:
    get:
      summary: Complete Cognito sign-in
      operationId: completeSignIn
      security: []
      responses:
        '302': { description: Session created and redirected }
        '400': { $ref: '#/components/responses/Problem' }
  /api/auth/logout:
    post:
      summary: Revoke the current user session
      operationId: logoutUser
      security: [{ userSession: [] }]
      responses:
        '200': { description: Session revoked }
        '401': { $ref: '#/components/responses/Problem' }
  /api/legal/consent:
    post:
      summary: Accept all current legal document versions
      operationId: acceptLegalDocuments
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Consent records created }
        '401': { $ref: '#/components/responses/Problem' }
  /api/templates:
    get:
      summary: List the three versioned agreement templates
      operationId: listTemplates
      security: [{ userSession: [] }]
      responses:
        '200': { description: Template descriptors }
        '401': { $ref: '#/components/responses/Problem' }
  /api/agreements:
    get:
      summary: List agreements visible to the current user
      operationId: listAgreements
      security: [{ userSession: [] }]
      responses:
        '200': { description: Agreements visible to the user }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create a draft agreement and queue its preview
      operationId: createAgreement
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Draft and preview job created }
        '402': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/agreements/{id}:
    get:
      summary: Get an agreement visible to the current user
      operationId: getAgreement
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AgreementId'
      responses:
        '200': { description: Agreement }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Create a new immutable agreement version
      operationId: updateAgreement
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AgreementId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: New agreement version }
        '412': { $ref: '#/components/responses/Problem' }
  /api/agreements/{id}/invite:
    post:
      summary: Invite the counterparty to review and sign
      operationId: inviteCounterparty
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AgreementId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Counterparty invited }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
  /api/agreements/{id}/invite/qr:
    get:
      summary: Current invitation link and QR code (SVG) for in-person signing
      operationId: getInvitationQr
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AgreementId'
      responses:
        '200': { description: "Invitation URL, expiry and QR SVG" }
        '404': { $ref: '#/components/responses/Problem' }
  /api/agreements/{id}/cancel:
    post:
      summary: Cancel an unsigned agreement
      operationId: cancelAgreement
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AgreementId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Agreement cancelled }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
  /api/agreements/{id}/milestones:
    post:
      summary: Add an agreement milestone
      operationId: addMilestone
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AgreementId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Milestone created }
        '412': { $ref: '#/components/responses/Problem' }
  /api/agreements/{id}/preview:
    get:
      summary: Download the private PDF preview
      operationId: getAgreementPreview
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AgreementId'
      responses:
        '200': { description: Private PDF preview }
        '404': { $ref: '#/components/responses/Problem' }
  /api/agreements/{id}/sign:
    post:
      summary: Creator signs the current version from the signed-in account (typed name and ESIGN consent)
      operationId: signAgreementAsCreator
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AgreementId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [typedName, consent]
              properties:
                typedName: { type: string, minLength: 3, maxLength: 120 }
                consent: { type: boolean, enum: [true] }
      responses:
        '200': { description: Signature recorded (method ACCOUNT_SESSION) }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/agreements/{id}/in-person:
    post:
      summary: Creator opens a single-use QR signing session (15 minutes); cancels any previous one
      description: The QR secret is derived from the Idempotency-Key and only its HMAC is stored; an exact retry returns the same session without storing the secret in the generic idempotency response table.
      operationId: startInPersonSigning
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AgreementId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: QR session opened
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt, svg]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
                  svg: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      summary: Creator polls the latest in-person session
      operationId: getInPersonSigning
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AgreementId'
      responses:
        '200': { description: 'Status NONE, OPEN, AWAITING_CONFIRMATION, COMPLETED, CANCELLED or EXPIRED' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/agreements/{id}/in-person/confirm:
    post:
      summary: Creator types the code shown on the counterparty device; records the counterparty signature (IN_PERSON_QR)
      operationId: confirmInPersonSigning
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AgreementId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { description: Counterparty signature recorded; agreement executed when both signed the same hash }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/in-person/{token}/request:
    post:
      summary: Counterparty signs on their own device; binds the device (cookie) and returns the code to show the creator
      operationId: requestInPersonSignature
      security: []
      parameters:
        - $ref: '#/components/parameters/QrToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [typedName, consent]
              properties:
                typedName: { type: string, minLength: 3, maxLength: 120 }
                consent: { type: boolean, enum: [true] }
      responses:
        '201': { description: 'Code (6 digits, 10 minutes) for the creator to type' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/in-person/{token}/status:
    get:
      summary: Counterparty device polls the session; details only for the bound device
      operationId: getInPersonStatusForCounterparty
      security: []
      parameters:
        - $ref: '#/components/parameters/QrToken'
      responses:
        '200': { description: 'Status OPEN, AWAITING_CONFIRMATION, COMPLETED or UNAVAILABLE' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/in-person/{token}/preview:
    get:
      summary: The exact PDF the counterparty is asked to sign, while the session is live
      operationId: getInPersonPreview
      security: []
      parameters:
        - $ref: '#/components/parameters/QrToken'
      responses:
        '200': { description: PDF }
        '404': { $ref: '#/components/responses/Problem' }
  /api/in-person/{token}/download-session:
    post:
      summary: Once, on the bound device within 2 hours of completion, opens a guest session to download the sealed PDF
      operationId: claimInPersonDownload
      security: []
      parameters:
        - $ref: '#/components/parameters/QrToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Guest session cookie set }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/agreements/{id}/record:
    get:
      summary: Party-only record view (derived confirmation outcome, slots, timeline of versions, signatures, seals, confirmations, messages and notes)
      operationId: getAgreementRecord
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AgreementId'
      responses:
        '200': { description: Record view; outcome is derived on read and never stored }
        '404': { $ref: '#/components/responses/Problem' }
  /api/agreements/{id}/confirmations:
    post:
      summary: Declare one confirmation for the caller's own role (insert-only; never verified by Theckards)
      operationId: declareConfirmation
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AgreementId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [ITEM_DELIVERED, ITEM_RECEIVED, SERVICE_DONE, SERVICE_ACCEPTED, PAYMENT_SENT, PAYMENT_RECEIVED, FULFILLED] }
                note: { type: string, maxLength: 500 }
      responses:
        '201': { description: Declared; the agreement becomes COMPLETED when every expected confirmation exists }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/agreements/{id}/messages:
    post:
      summary: Send an insert-only message to the other party (max 4000 characters)
      operationId: sendMessage
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AgreementId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string, minLength: 1, maxLength: 4000 } } }
      responses:
        '201': { description: Stored }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/agreements/{id}/notes:
    post:
      summary: Add an insert-only note to the record (max 500 characters, visible to both parties, never public)
      operationId: addRecordNote
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AgreementId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string, minLength: 1, maxLength: 500 } } }
      responses:
        '201': { description: Stored }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/claim:
    post:
      summary: Link the counterparty party (proven by the bound-device guest session) to the signed-in account
      operationId: claimCounterpartyParty
      security: [{ userSession: [], guestSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Linked }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/agreements/{id}/documents/final:
    get:
      summary: Download the sealed final PDF
      operationId: downloadFinalDocument
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AgreementId'
      responses:
        '200': { description: Sealed PDF }
        '404': { $ref: '#/components/responses/Problem' }
  /api/agreements/{id}/documents/final/receipt:
    get:
      summary: Download the machine-readable receipt for the sealed final PDF
      operationId: downloadFinalReceipt
      security: [{ userSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AgreementId'
      responses:
        '200': { description: ECDSA-signed receipt JSON }
        '404': { $ref: '#/components/responses/Problem' }
  /api/guest/{token}/otp:
    post:
      summary: Email the invited counterparty a 6-digit code (409 while EMAIL_DELIVERY_ENABLED is off)
      operationId: requestGuestCode
      security: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '202': { description: Code emailed }
        '404': { $ref: '#/components/responses/Problem' }
  /api/guest/{token}/complete:
    post:
      summary: Verify the code and sign or request changes; consumes the invitation and opens a 2-hour guest session
      operationId: completeGuestAction
      security: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200': { description: Action recorded }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/guest/documents/final:
    get:
      summary: Download the sealed PDF for the guest's agreement
      operationId: downloadGuestFinalDocument
      security: [{ guestSession: [] }]
      responses:
        '200': { description: Sealed PDF }
        '404': { $ref: '#/components/responses/Problem' }
  /api/guest/documents/final/receipt:
    get:
      summary: Download the machine-readable receipt for the guest's sealed PDF
      operationId: downloadGuestFinalReceipt
      security: [{ guestSession: [] }]
      responses:
        '200': { description: ECDSA-signed receipt JSON }
        '404': { $ref: '#/components/responses/Problem' }
  /api/public/verify/{sha256}:
    get:
      summary: Verify a SHA-256 against public seal metadata; malformed and unknown hashes return the same false response
      operationId: verifyPublicSeal
      security: []
      parameters:
        - $ref: '#/components/parameters/Sha256'
      responses:
        '200':
          description: Public verification result, cached for 60 seconds
          content:
            application/json:
              schema:
                type: object
                required: [valid, kind, sealed_at, seal_id, anchored]
                properties:
                  valid: { type: boolean }
                  kind: { type: [string, 'null'], enum: [FINAL, ADDENDUM, DOSSIER, null] }
                  sealed_at: { type: [string, 'null'], format: date-time }
                  seal_id: { type: [string, 'null'], format: uuid }
                  anchored: { type: boolean }
        '429': { $ref: '#/components/responses/Problem' }
  /.well-known/theckards-keys.json:
    get:
      summary: Public seal verification keys (old keys are never removed)
      operationId: getSealPublicKeys
      security: []
      responses:
        '200': { description: Public keys }
  /api/admin/settings:
    get:
      summary: List product settings
      operationId: listAdminSettings
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Settings }
        '403': { $ref: '#/components/responses/Problem' }
  /api/admin/settings/{key}:
    patch:
      summary: Update and version a product setting
      operationId: updateAdminSetting
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SettingKey'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Setting updated }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/admin/settings/{key}/history:
    get:
      summary: List setting version history
      operationId: listAdminSettingHistory
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SettingKey'
      responses:
        '200': { description: Version history }
        '403': { $ref: '#/components/responses/Problem' }
  /api/admin/settings/{key}/rollback:
    post:
      summary: Roll back a setting by creating a new version
      operationId: rollbackAdminSetting
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SettingKey'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Setting rolled back }
        '403': { $ref: '#/components/responses/Problem' }
  /api/admin/legal:
    get:
      summary: List legal document versions
      operationId: listLegalDocumentVersions
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Legal documents }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create the next legal draft version
      operationId: createLegalDraft
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Draft created }
        '403': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    userSession:
      type: apiKey
      in: cookie
      name: __Host-theckards_session
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-theckards_admin_session
    guestSession:
      type: apiKey
      in: cookie
      name: __Host-theckards_guest_session
  parameters:
    Sha256:
      name: sha256
      in: path
      required: true
      description: A candidate digest. Malformed values receive the same response as unknown digests.
      schema: { type: string }
    AgreementId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QrToken:
      name: token
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{40,64}$' }
    InviteToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 20, maxLength: 128 }
    SettingKey:
      name: key
      in: path
      required: true
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, request_id]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        request_id: { type: string }
  responses:
    Problem:
      description: Problem Details response
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
